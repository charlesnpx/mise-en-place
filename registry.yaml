# registry.yaml — declares which skills mise-en-place knows about.
#
# managed: skills authored in this repo under skills/<name>/.
# delegated: polyrepo skills with their own install-skill.sh. Public users may
# not have access to private/team-only delegated repos; optional delegated skills
# are skipped by default install unless explicitly requested.
# experimental: managed or delegated skills excluded from default install.
# external_tools: third-party executables used by skills. Default tools are
# verified or installed during default install.

managed:
  - humanizer
  - gemini-vision
  - visual-qa
  - rebase-up
  - pr
  - azure-static-site
  - to-audience

renames:
  review-pr: pr

delegated:
  ado-query:
    repo: github.com/charlesnpx/ado-query
    channel: latest-release
    visibility: public
    optional: false
  npx-ado-query:
    repo: github.com/charlesnpx/npx-ado-query
    channel: latest-release
    visibility: private
    optional: true
  browse:
    repo: github.com/charlesnpx/browse
    channel: latest-release
    fallback_ref: main
    visibility: private
    optional: true
    tools:
      - executable: browse
        manager: pipx
        package: browse
        install_from: checkout
  keyframe:
    repo: github.com/charlesnpx/keyframe
    channel: latest-release
    fallback_ref: main
    visibility: public
    optional: false
    tools:
      - executable: keyframe
        manager: pipx
        package: keyframe
        install_from: checkout
  figma-fetch:
    repo: github.com/charlesnpx/figma-fetch
    channel: latest-release
    visibility: public
    optional: false
  convo-relay:
    repo: github.com/charlesnpx/convo-relay
    channel: latest-release
    fallback_ref: main
    visibility: private
    optional: true
  convo-porter:
    repo: github.com/charlesnpx/convo-porter
    channel: latest-release
    fallback_ref: main
    visibility: public
    optional: false
    tools:
      - executable: convo-porter
        manager: pipx
        package: convo-porter
        install_from: checkout
  feature-implement:
    repo: github.com/charlesnpx/feature-implement
    channel: latest-release
    fallback_ref: main
    visibility: public
    optional: false
  subreview:
    repo: github.com/charlesnpx/subreview
    channel: latest-release
    fallback_ref: main
    visibility: public
    optional: false
  agentbus:
    repo: github.com/charlesnpx/agentbus
    channel: latest-release
    fallback_ref: main
    visibility: private
    optional: true
  # delegate requires agentbus on PATH; install agentbus first.
  delegate:
    repo: github.com/charlesnpx/delegate
    channel: latest-release
    fallback_ref: main
    visibility: private
    optional: true
experimental:
  - azure-static-site
  - browse
  - feature-implement
  - subreview
  - agentbus
  - delegate

external_tools:
  markitdown:
    executable: markitdown
    manager: pipx
    package: "markitdown[all]"
    install_by_default: true
    optional: true
    required_by:
      - ado-query
