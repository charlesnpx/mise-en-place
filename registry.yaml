# registry.yaml — declares which skills mise-en-place knows about.
#
# managed: skills authored in this repo under skills/<name>/.
# delegated: polyrepo skills with their own install-skill.sh. Public users may
# not have access to private/team-only delegated repos; optional delegated skills
# are skipped by `mise-en-place install --all` unless --strict is supplied.

managed:
  - humanizer
  - gemini-vision
  - visual-qa
  - rebase-up
  - review-pr

delegated:
  ado-query:
    repo: github.com/charlesnpx/ado-query
    ref: main
    visibility: public
    optional: false
  npx-ado-query:
    repo: github.com/charlesnpx/npx-ado-query
    ref: main
    visibility: private
    optional: true
  browse:
    repo: github.com/charlesnpx/browse
    ref: main
    visibility: private
    optional: true
  keyframe:
    repo: github.com/charlesnpx/keyframe
    ref: main
    visibility: public
    optional: false
  figma-fetch:
    repo: github.com/charlesnpx/figma-fetch
    ref: main
    visibility: public
    optional: false
  miro-fetch:
    repo: github.com/charlesnpx/miro-fetch
    ref: main
    visibility: public
    optional: false
  convo-relay:
    repo: github.com/charlesnpx/convo-relay
    ref: main
    visibility: private
    optional: true
  convo-porter:
    repo: github.com/charlesnpx/convo-porter
    ref: main
    visibility: public
    optional: false
