name: pr
version: 0.4.0
manifest_schema: 1
min_installer: "0.1.0"
capabilities:
  - query
targets:
  claude:
    type: skill_dir
    payload: claude
    install_to: ~/.claude/skills
  codex:
    type: skill_dir
    payload: codex
    install_to: ~/.codex/skills
setup:
  - kind: executable
    executable: gh
    required_for:
      - query
    remediation: Install GitHub CLI, then run `gh auth login`.
  - kind: github-cli-auth
    required_for:
      - query
    remediation: Run `gh auth login`, then verify with `gh auth status`.
