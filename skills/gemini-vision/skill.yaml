name: gemini-vision
version: 0.1.3
manifest_schema: 1
min_installer: "0.1.0"
capabilities:
  - read
targets:
  claude:
    type: skill_dir
    payload: claude
    install_to: ~/.claude/skills/gemini-vision
  codex:
    type: skill_dir
    payload: codex
    install_to: ~/.codex/skills/gemini-vision
setup:
  - kind: executable
    executable: gemini
    required_for:
      - read
    remediation: Install and authenticate Gemini CLI before using gemini-vision.
